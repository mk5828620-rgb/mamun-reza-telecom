    :root {

      min-height: 100%;

    .container {

      max-width: 1080px;
      margin: 0 auto;

    header {
      position: sticky;

      z-index: 50;
      background: rgba(7, 11, 20, 0.94);
      border-bottom: 1px solid var(--border);
    }

      display: flex;

      justify-content: space-between;
      min-height: 72px;
      padding: 8px 0;
      gap: 12px;
    }

      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--silver-bright);
    }

    .logo-gear {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--silver-bright);
    }

      font-size: 0.72rem;

      font-weight: 600;
